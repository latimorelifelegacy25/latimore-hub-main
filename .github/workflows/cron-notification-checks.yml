name: Notification checks cron (every 15 minutes)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call notification-checks cron endpoint
        run: |
          curl -fsS -X GET "$PRODUCTION_URL/api/cron/notification-checks" \
            -H "x-cron-secret: $CRON_SECRET"
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
