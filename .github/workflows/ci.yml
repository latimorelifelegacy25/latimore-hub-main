name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: lint typecheck build test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck app
        run: npm run typecheck

      - name: Install agent harness dependencies
        run: npm run agent-harness:setup

      - name: Typecheck agent harness
        run: npm run agent-harness:typecheck

      - name: Install edge worker dependencies
        run: npm run worker:setup

      - name: Typecheck edge worker
        run: npm run worker:typecheck

      - name: Build
        run: npm run build
